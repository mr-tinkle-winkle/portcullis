[project]
name = "portcullis"
version = "0.1.0"
description = "Per-app network gate: block or add latency to incoming / outgoing traffic, with auto-detected apps"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "NetfilterQueue",
]

[project.scripts]
portcullis = "portcullis.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["portcullis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
